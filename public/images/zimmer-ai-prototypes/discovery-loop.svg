<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">Discovery and prototyping together</title>
  <desc id="desc">An illustrative process connecting workflow mapping, a mock-data prototype, two initial use cases, and engineering collaboration. Discovery continues throughout. This is not a product screenshot.</desc>
  <rect width="1100" height="820" fill="#183444"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="84" font-size="19" letter-spacing="4" fill="#dcc495">ZIMMER BIOMET · PRODUCT DISCOVERY</text>
    <text x="70" y="157" font-size="49" fill="#f4f0e7">Make the direction concrete.</text>
    <text x="70" y="197" font-size="23" fill="#cbdedc">Map, prototype, agree, and keep learning.</text>
    <path d="M506 357H592M832 440V510M594 605H506M270 510V440" fill="none" stroke="#d98f63" stroke-width="4"/>
    <path d="m578 348 14 9-14 9m245 130 9 14 9-14M520 596l-14 9 14 9m-259-160 9-14 9 14" fill="none" stroke="#d98f63" stroke-width="4"/>
    <g fill="#224b56" stroke="#5a7e80" stroke-width="1">
      <rect x="70" y="270" width="435" height="170" rx="4"/>
      <rect x="595" y="270" width="435" height="170" rx="4"/>
      <rect x="595" y="510" width="435" height="170" rx="4"/>
      <rect x="70" y="510" width="435" height="170" rx="4"/>
    </g>
    <g fill="#dcc495" font-size="17" letter-spacing="3">
      <text x="100" y="315">01 · DISCOVER</text><text x="625" y="315">02 · MAKE IT TANGIBLE</text>
      <text x="625" y="555">03 · FOCUS</text><text x="100" y="555">04 · DEVELOP TOGETHER</text>
    </g>
    <g fill="#f4f0e7" font-size="29">
      <text x="100" y="365">Workflow mapping</text><text x="625" y="365">Mock-data prototype</text>
      <text x="625" y="605">Two initial use cases</text><text x="100" y="605">Engineering collaboration</text>
    </g>
    <g fill="#cbdedc" font-size="21">
      <text x="100" y="405">Continue as the work evolves</text><text x="625" y="405">Surface the intended experience</text>
      <text x="625" y="645">Defined with stakeholders</text><text x="100" y="645">Shared architecture and delivery</text>
    </g>
    <text x="70" y="752" font-size="18" fill="#cbdedc">ILLUSTRATIVE APPROACH · ONGOING DEVELOPMENT · NOT A PRODUCT SCREENSHOT</text>
  </g>
</svg>
